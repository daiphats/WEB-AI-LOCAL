  <!-- Exhalation airflow stream indicator -->
  <path d="M 115,132 Q 130,130 145,134" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="100" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" text-anchor="middle">PARASYMPATHETIC EXHALATION</text>
