<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="90" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>
  
  <path d="M 50,85 C 50,45 150,45 150,85 C 150,140 130,165 100,165 C 70,165 50,140 50,85 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  
  <!-- Dropped gentle eyebrows -->
  <path d="M 68,76 Q 80,78 94,80" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 132,76 Q 120,78 106,80" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Gently closed content eyes -->
  <path d="M 70,95 Q 80,102 90,95" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 110,95 Q 120,102 130,95" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
