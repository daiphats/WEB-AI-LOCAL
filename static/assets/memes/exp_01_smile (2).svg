<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Subtle circular grid / anatomical reference -->
  <circle cx="100" cy="100" r="90" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Face boundary -->
  <path d="M 50,85 C 50,45 150,45 150,85 C 150,140 130,165 100,165 C 70,165 50,140 50,85 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  
  <!-- Duchenne eyes with subtle crow's feet wrinkles -->
  <path d="M 68,90 Q 80,82 92,90" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 62,88 L 67,90" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 63,94 L 68,93" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <path d="M 108,90 Q 120,82 132,90" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 133,90 L 138,88" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 132,93 L 137,94" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Relaxed eyebrows -->
  <path d="M 65,76 Q 80,72 94,76" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 106,76 Q 120,72 135,76" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose bridge & tip -->
  <path d="M 100,88 L 98,110 L 104,112" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Duchenne Smile (Zygomaticus major activation) -->
  <path d="M 72,125 Q 100,150 128,125" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <path d="M 70,123 L 68,120" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130,123 L 132,120" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Scientific anatomical vectors -->
  <line x1="72" y1="125" x2="60" y2="105" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="128" y1="125" x2="140" y2="105" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="100" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" text-anchor="middle">ZYGOMATICUS MAJOR VECTOR</text>
</svg>
