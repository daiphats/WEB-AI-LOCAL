<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="90" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>
  
  <path d="M 50,85 C 50,45 150,45 150,85 C 150,140 130,165 100,165 C 70,165 50,140 50,85 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  
  <!-- High elevated eyebrows (Frontalis) -->
  <path d="M 64,65 Q 80,55 96,65" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 104,65 Q 120,55 136,65" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wide open alert eyes -->
  <circle cx="80" cy="88" r="10" fill="none" stroke="#0F172A" stroke-width="2"/>
  <circle cx="80" cy="88" r="4" fill="#0F172A"/>

  <circle cx="120" cy="88" r="10" fill="none" stroke="#0F172A" stroke-width="2"/>
  <circle cx="120" cy="88" r="4" fill="#0F172A"/>

  <!-- Nose -->
  <path d="M 100,85 L 98,108 L 104,110" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- O-shaped open mouth -->
  <ellipse cx="100" cy="135" rx="14" ry="18" fill="none" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Anatomical elevation vectors -->
  <line x1="80" y1="65" x2="80" y2="50" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="120" y1="65" x2="120" y2="50" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="100" y="185" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" text-anchor="middle">FRONTALIS ELEVATION VECTOR</text>
</svg>
